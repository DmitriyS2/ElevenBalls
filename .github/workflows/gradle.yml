name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ─── Debug: для всех ────────────────────────────────────────
  debug:
    name: Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 19
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # ─── Release: только release-ветки ──────────────────────────
  release:
    name: Release build
    runs-on: ubuntu-latest
    needs: debug
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'release-')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release-'))
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 19
      - run: chmod +x ./gradlew
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keyForApk.jks
      - name: Create keystore.properties
        run: |
          printf 'storeFile=keyForApk.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties
      - run: ./gradlew assembleRelease --stacktrace
      - run: ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn